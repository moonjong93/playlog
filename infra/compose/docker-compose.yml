# 공개 서비스 + Cloudflare Tunnel (app LXC 전용)
#
#   docker compose -f infra/compose/docker-compose.yml up -d --build
#
# 원칙
#  - 호스트 포트를 열지 않는다(ports: 금지). cloudflared 가 같은 네트워크에서
#    서비스명:포트 로 직접 붙는다.
#  - 서비스별 env_file/볼륨을 분리한다. 볼륨은 ./data/<service> (호스트에서
#    미리 mkdir + 소유권 설정; web 이미지는 uid 1000 으로 돈다).
name: playlog-infra

networks:
  edge:
    driver: bridge

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      # config.yml + <TUNNEL-ID>.json (둘 다 gitignore 대상)
      - ../cloudflared:/etc/cloudflared:ro
    networks: [edge]
    depends_on: [news-web]

  news-web:
    build:
      context: ../../web          # web/Dockerfile 그대로 사용
    image: news-web:local
    container_name: news-web
    restart: unless-stopped
    env_file: ../env/news-web.env
    volumes:
      - ./data/news-web:/app/data
    networks: [edge]
    # 공개 개방이 아니라 로컬 writer 발행용 loopback 전용.
    # 외부 유입은 여전히 cloudflared(같은 docker 네트워크)뿐이다.
    ports:
      - "127.0.0.1:8787:8787"
    # cloudflared → http://news-web:8787

  # 두 번째 공개 서비스 템플릿. 준비되면 주석을 풀고 값을 채운다.
  # service2:
  #   build:
  #     context: ../../service2
  #   image: service2:local
  #   container_name: service2
  #   restart: unless-stopped
  #   env_file: ../env/service2.env
