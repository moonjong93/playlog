# web 배포용 (개인 서버 + Cloudflare Tunnel)
#
#   cd web
#   cp .env.example .env    # WEB_API_KEY, SESSION_SECRET 채운다
#   docker compose up -d --build
#
# 외부 노출은 cloudflared 가 담당한다. 포트는 호스트 루프백(127.0.0.1)에만 연다:
#   cloudflared tunnel --url http://127.0.0.1:8787
#
# 값은 compose 가 같은 디렉터리의 .env 를 자동으로 읽어서 ${...} 자리에 채운다.
# WEB_API_KEY/SESSION_SECRET 이 비어 있으면 기동 전에 에러로 멈춘다(:?).

name: web

services:
  web:
    build: .
    image: news-web:local
    container_name: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
    environment:
      WEB_API_KEY: ${WEB_API_KEY:?web/.env 에 WEB_API_KEY 를 설정하세요}
      SESSION_SECRET: ${SESSION_SECRET:?web/.env 에 SESSION_SECRET 을 설정하세요}
      PORT: "8787"
      HOST: "0.0.0.0"
      WEB_DB: /app/data/web.db
      TRUST_PROXY: cloudflare
      SITE_URL: ${SITE_URL:-https://news.example.com}
      COOKIE_SECURE: "1"
      RATE_LIMIT_DISABLED: "0"
